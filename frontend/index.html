  <!-- Per-environment config override (optional). For production, set
       window.OPC_ENV here (or uncomment an env.js) BEFORE config.js loads —
       e.g. the public Cloudflare-tunnel Supabase URL. config.js falls back to
       its built-in dev defaults when OPC_ENV is not pre-set.
       <script src="env.js"></script> -->

  <!-- Maintenance gate. A SEPARATE cloud monitoring project (Maintenance Control)
       tells this app when to show an "Under Maintenance" screen. It ONLY does a
       GET on one public table in that other project via plain fetch(), never
       touches this app's own backend/session, and is FAIL-OPEN: any error,
       timeout, missing config or unknown key renders the real app.
       Loaded before any app script. window.MC.key is empty by default so the gate
       stays inert; to activate, set window.MC (with the PUBLIC maintenance anon
       key) via an env.js / deploy snippet — same override idiom as OPC_ENV above,
       so the key is never committed. See frontend/.env.example. -->
  <script>
    // publicPaths: pages that stay reachable during maintenance. SO-PO is an internal,
    // hash-routed ERP (window.location.pathname is always "/") with no public landing/
    // marketing/legal pages — so nothing is public and the whole app (incl. login) is
    // gated. Do NOT add "/" here: it would match every route and disable maintenance.
    window.MC = window.MC || { url: 'https://qknaxyagucgepawvrgto.supabase.co', key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFrbmF4eWFndWNnZXBhd3ZyZ3RvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NTM2NzgsImV4cCI6MjEwMjUyOTY3OH0.4xa8a27PK3gn_2GtXQCQGFmYdz2ASYPcGGm7rUYMc8c', project: 'so-po', publicPaths: [] };
  </script>
  <script src="vanilla-guard.js"></script>
</head>

       RLS on organization_memberships is the real boundary. -->
  <script src="src/tenant-context.js"></script>
