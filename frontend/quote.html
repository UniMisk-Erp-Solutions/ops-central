<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Submit your quote</title>
  <style>
    :root { --ink:#1f2430; --mut:#7b8394; --line:#e6e8ee; --brand:#2b3a67; --ok:#1b7a43; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif; color:var(--ink); background:#f4f5f8; }
    .wrap { max-width:640px; margin:0 auto; padding:22px 16px 60px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:20px; }
    h1 { font-size:18px; margin:0 0 2px; }
    .sub { color:var(--mut); font-size:13px; margin:0 0 16px; }
    table { width:100%; border-collapse:collapse; }
    th,td { padding:9px 8px; border-bottom:1px solid var(--line); font-size:14px; text-align:left; }
    th { font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--mut); }
    td.num, th.num { text-align:right; }
    input[type=number] { width:120px; padding:8px 10px; border:1px solid #cfd4de; border-radius:7px; font-size:14px; text-align:right; }
    input:focus { outline:none; border-color:var(--brand); }
    .btn { width:100%; margin-top:18px; background:var(--brand); color:#fff; border:0; padding:13px; border-radius:9px; font-size:15px; font-weight:600; cursor:pointer; }
    .btn:disabled { opacity:.55; cursor:default; }
    .muted { color:var(--mut); font-size:12px; }
    .total { display:flex; justify-content:space-between; font-weight:700; padding:12px 8px 0; font-size:15px; }
    .state { text-align:center; padding:44px 10px; color:var(--mut); }
    .ok { color:var(--ok); }
    .brandbar { font-weight:700; color:var(--brand); margin-bottom:14px; font-size:15px; }
    .err { background:#fdecec; color:#b12; padding:10px 12px; border-radius:8px; font-size:13px; margin-top:12px; }
    .item { border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:12px; }
    .item-h { display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:10px; }
    .item-h .nm { font-weight:600; font-size:14px; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .fld label { display:block; font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--mut); margin-bottom:3px; }
    .fld input { width:100%; padding:8px 10px; border:1px solid #cfd4de; border-radius:7px; font-size:14px; text-align:left; }
    .fld input.num { text-align:right; }
    .fld input:focus { outline:none; border-color:var(--brand); }
    @media (max-width:520px){ .grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brandbar">Request for Quotation</div>
    <div class="card" id="card"><div class="state" id="state">Loading your quote…</div></div>
    <p class="muted" style="text-align:center;margin-top:14px">Your prices are sent securely. This link is private to you.</p>
  </div>
  <script>
    (function () {
      // Public Supabase edge function (anon key is public by design, RLS-protected).
      var SB = 'https://so-po.unimisk.com';
      var ANON = 'eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJzdXBhYmFzZSIsImlhdCI6MTc4MDM4NDg2MCwiZXhwIjo0OTM2MDU4NDYwLCJyb2xlIjoiYW5vbiJ9.0AhbGOMbIybN0azUCAuoriNKGtSwdpznBqCQbZDpxZM';
      var SBH = { apikey: ANON, Authorization: 'Bearer ' + ANON };
      var qs = new URLSearchParams(location.search);
      var token = qs.get('t');
      var card = document.getElementById('card');
      var inr = function (n) { return '₹' + (Number(n) || 0).toLocaleString('en-IN'); };
      var esc = function (s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; };

      function show(html) { card.innerHTML = html; }
      function fail(msg) { show('<div class="state">' + esc(msg) + '</div>'); }

      if (!token) { fail('This quote link is missing its code. Please use the link from your email.'); return; }

      fetch(SB + '/functions/v1/main/quote-load?t=' + encodeURIComponent(token), { headers: SBH })
        .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
        .then(function (o) {
          if (!o.ok) { fail((o.j && o.j.error) || 'This link is not valid.'); return; }
          var d = o.j;
          if (d.submitted) { renderThanks(true); return; }
          render(d);
        })
        .catch(function () { fail('Could not load your quote. Please check your connection and retry.'); });

      function render(d) {
        var items = d.items || [];
        var terms = d.terms || {};
        var anyLock = false;
        var blocks = items.map(function (it, i) {
          var pid = esc(it.product_id);
          var pre = (d.prices && d.prices[it.product_id]);
          var tm = terms[it.product_id] || {};
          var lk = it.lock || {};
          function inp(f, label, type, ph, val, isPrice) {
            var locked = lk[f];
            var isLocked = locked !== undefined && locked !== null && locked !== '';
            if (isLocked) anyLock = true;
            var attrs = 'data-pid="' + pid + '" data-f="' + f + '"' + (isPrice ? ' data-qty="' + (it.qty || 0) + '"' : '');
            var cls = (type === 'number' ? 'num' : '');
            if (isLocked) {
              return '<div class="fld"><label>' + label + ' <span style="color:#8a5a00;font-weight:600">🔒 required by buyer</span></label>' +
                '<input class="' + cls + '" type="' + type + '" ' + attrs + ' value="' + esc(locked) + '" readonly disabled style="background:#f7f2e6;color:#555;cursor:not-allowed"></div>';
            }
            var numAttrs = (type === 'number' ? ' min="0"' + (isPrice ? ' step="0.01"' : '') : '');
            return '<div class="fld"><label>' + label + '</label><input class="' + cls + '" type="' + type + '"' + numAttrs + ' ' + attrs + ' value="' + (val != null && val !== '' ? esc(val) : '') + '" placeholder="' + ph + '"></div>';
          }
          return '<div class="item" data-i="' + i + '">' +
            '<div class="item-h"><span class="nm">' + esc(it.name) + (it.code ? ' <span class="muted">(' + esc(it.code) + ')</span>' : '') + '</span>' +
            '<span class="muted">Qty ' + (it.qty || 0) + ' · <span id="line-' + i + '">—</span></span></div>' +
            '<div class="grid">' +
              inp('price', 'Unit price ₹ *', 'number', '0', pre, true) +
              inp('delivery_days', 'Delivery (days)', 'number', 'e.g. 7', tm.delivery_days, false) +
              inp('payment_terms', 'Payment terms', 'text', 'e.g. 50% advance, net 30', tm.payment_terms, false) +
              inp('notes', 'Notes / other', 'text', 'warranty, brand, MOQ…', tm.notes, false) +
            '</div></div>';
        }).join('');
        var lockNote = anyLock ? '<p class="muted" style="margin:-6px 0 12px">🔒 Some fields are set by the buyer and can’t be changed — please quote around them.</p>' : '';
        var reasonBanner = d.refloat_reason ? '<div style="background:#fff6e5;border:1px solid #ffe0a3;border-radius:8px;padding:10px 12px;margin:0 0 14px;color:#8a5a00;font-size:13px"><strong>We\'ve asked you to revise this quote.</strong><br>Reason: ' + esc(d.refloat_reason) + '</div>' : '';
        show(
          '<h1>' + (d.refloat_reason ? 'Revise your quote' : 'Enter your quote') + (d.rfq_no ? ' · ' + esc(d.rfq_no) : '') + '</h1>' +
          '<p class="sub">' + esc(d.vendor || '') + ' — fill your unit price (and delivery / payment terms if any) for each item, then submit.</p>' +
          reasonBanner +
          lockNote +
          blocks +
          '<div class="total"><span>Total</span><span id="grand">₹0</span></div>' +
          '<button class="btn" id="send">Submit quote</button>' +
          '<div id="msg"></div>'
        );
        var priceInputs = Array.prototype.slice.call(card.querySelectorAll('input[data-f="price"]'));
        function recalc() {
          var g = 0;
          priceInputs.forEach(function (inp, i) {
            var v = Number(inp.value) || 0, q = Number(inp.getAttribute('data-qty')) || 0;
            var line = v * q; g += line;
            var cell = document.getElementById('line-' + i); if (cell) cell.textContent = v ? inr(line) : '—';
          });
          document.getElementById('grand').textContent = inr(g);
        }
        priceInputs.forEach(function (inp) { inp.addEventListener('input', recalc); });
        recalc();
        document.getElementById('send').addEventListener('click', function () {
          var prices = {}, termsOut = {}, any = false;
          var all = Array.prototype.slice.call(card.querySelectorAll('input[data-pid]'));
          all.forEach(function (inp) {
            var pid = inp.getAttribute('data-pid'), f = inp.getAttribute('data-f'), val = inp.value;
            if (f === 'price') { var v = Number(val); if (v > 0) { prices[pid] = v; any = true; } }
            else if (val != null && String(val).trim() !== '') { termsOut[pid] = termsOut[pid] || {}; termsOut[pid][f] = f === 'delivery_days' ? (Number(val) || 0) : String(val).trim(); }
          });
          if (!any) { document.getElementById('msg').innerHTML = '<div class="err">Please enter at least one price.</div>'; return; }
          var btn = document.getElementById('send'); btn.disabled = true; btn.textContent = 'Submitting…';
          fetch(SB + '/functions/v1/main/quote-submit', { method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json' }, SBH), body: JSON.stringify({ t: token, prices: prices, terms: termsOut }) })
            .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
            .then(function (o) {
              if (o.ok && o.j.ok) { renderThanks(false); }
              else { btn.disabled = false; btn.textContent = 'Submit quote'; document.getElementById('msg').innerHTML = '<div class="err">' + esc((o.j && o.j.error) || 'Could not submit. Try again.') + '</div>'; }
            })
            .catch(function () { btn.disabled = false; btn.textContent = 'Submit quote'; document.getElementById('msg').innerHTML = '<div class="err">Network error. Please retry.</div>'; });
        });
      }

      function renderThanks(already) {
        show('<div class="state"><div style="font-size:40px" class="ok">✓</div><h1 style="margin:10px 0 4px">' +
          (already ? 'Quote already received' : 'Thank you — quote submitted') + '</h1>' +
          '<p class="sub" style="text-align:center">Your prices have reached the buyer. You can close this page.</p></div>');
      }
    })();
  </script>
</body>
</html>
